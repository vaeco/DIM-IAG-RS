# Reference configuration for the final DIM-IAG-RS Dual-Gate Router.
# The inference script uses command-line arguments; this file documents the
# validated defaults.

model:
  base_alpha: 0.60
  conservative_ckpt: weights/dim_iag_rs_best.pth
  bright_ckpt: weights/dim_iag_rs_bright_gate_best.pth

router:
  center: 0.81
  width: 0.02
  rho_max: 0.95
  under_threshold: 0.35
  over_threshold: 0.88
  risk_over_weight: 1.50
  risk_noise_weight: 0.50
  risk_floor: 0.50

inference:
  device: cuda:0
  print_freq: 100
